<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CX Profit Platform — Приложение</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a0a0f'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-size='22' font-weight='bold' fill='%236c5ce7' font-family='sans-serif'%3E◆%3C/text%3E%3C/svg%3E" />
  <script type="module" src="/src/main.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <div class="topbar__logo">◆ CX<span class="c-accent">Profit</span></div>
      <nav class="topbar__nav" id="topNav">
        <button class="topbar__btn active" data-tab="executive">📋 Executive</button>
        <button class="topbar__btn" data-tab="dashboard">📊 Дашборд</button>
        <button class="topbar__btn" data-tab="journey">🗺️ Journey</button>
        <button class="topbar__btn" data-tab="profit">💰 Profit</button>
        <button class="topbar__btn" data-tab="sim">🎮 Симулятор</button>
        <button class="topbar__btn" data-tab="voice">🔍 Voice AI</button>
        <button class="topbar__btn" data-tab="roi">📐 ROI</button>
      </nav>
    </div>
  </header>

  <main id="app"></main>

  <style>
    @media print {
      body { background: #fff !important; color: #111 !important; }
      .topbar, .pdf-btn, .topbar__btn { display: none !important; }
      .view { padding: 0 !important; max-width: 100% !important; }
      #app { padding-top: 0 !important; }
      .block, .card, .sim-b, .sim-l, .roi-c { break-inside: avoid; background: #fff !important; border-color: #ddd !important; }
      .sim-ctrl input { display: none !important; }
      .sim-ctrl label .val { color: #111 !important; font-size: 14px !important; }
      .bar { background: #eee !important; }
      .bar__fill { opacity: 0.7 !important; }
      .vreason { break-inside: avoid; background: #f9f9f9 !important; border-color: #eee !important; }
      .vreason .q { background: #f0f0f0 !important; border-left-color: #6c5ce7 !important; color: #333 !important; }
      .grid-2 { grid-template-columns: 1fr 1fr !important; page-break-inside: avoid; }
      .roi-f input { display: none !important; }
      .roi-f .rv span:first-child, .roi-f .rv span:last-child { display: none !important; }
      .alert-item { break-inside: avoid; }
      .jmap { flex-wrap: nowrap !important; }
      .jnode { background: #f9f9f9 !important; border-color: #ddd !important; }
      .jarrow { color: #ddd !important; }
      .jdrop { background: #fff5f5 !important; }
      .action-item__roi { color: #00b894 !important; }
      .issue-card { border-left-color: #e17055 !important; }
      .card__l, .card__t, .block__h, .l, .stat__l, .sim-row .l, .roi-res .l { color: #555 !important; }
      .card__v, .stat__r, .sim-row .v, .roi-res .v { color: #111 !important; }
      .card__v--dng { color: #d63031 !important; }
      .card__v--prf, .roi-res .v--p, .sim-row .v--p { background: none !important; -webkit-text-fill-color: initial !important; color: #00b894 !important; }
      .card--hl { border-color: #6c5ce7 !important; }
      .pdf-header { display: block !important; text-align: center; font-size: 18px; font-weight: 700; color: #6c5ce7; margin-bottom: 16px; }
      .pdf-meta { display: block !important; text-align: center; font-size: 11px; color: #999; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid #ddd; }
      @page { margin: 1.5cm; }
    }
    .pdf-header, .pdf-meta { display: none; }
    .pdf-btn {
      position: fixed; bottom: 24px; right: 24px; z-index: 999;
      background: #6c5ce7; color: #fff; border: none;
      padding: 12px 20px; border-radius: 100px;
      font-size: 14px; font-weight: 600; cursor: pointer;
      font-family: inherit; box-shadow: 0 4px 20px rgba(108,92,231,0.35);
      transition: all .2s; display: flex; align-items: center; gap: 8px;
    }
    .pdf-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 28px rgba(108,92,231,0.45); }
    @media print { .pdf-btn { display: none !important; } }
    .jmap { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; padding: 16px 0; }
    .jnode { flex: 1; min-width: 130px; max-width: 160px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; padding: 14px 12px; text-align: center; cursor: pointer; transition: all .2s; }
    .jnode:hover { border-color: #6c5ce7; background: rgba(108,92,231,0.05); }
    .jnode--active { border-color: #6c5ce7; background: rgba(108,92,231,0.08); }
    .jnode--drop { border-color: rgba(225,112,85,0.3); }
    .jnode__icon { font-size: 24px; margin-bottom: 4px; }
    .jnode__name { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
    .jnode__clients { font-size: 11px; color: #a1a1aa; }
    .jnode__conv { font-size: 14px; font-weight: 700; font-family: monospace; margin-top: 4px; }
    .jnode__conv--up { color: #55efc4; }
    .jnode__conv--dn { color: #e17055; }
    .jarrow { display: flex; align-items: center; color: rgba(255,255,255,0.15); font-size: 18px; }
    .jdetail { display: none; margin-top: 16px; }
    .jdetail--open { display: block; }
    .jdrop { background: rgba(225,112,85,0.04); border: 1px solid rgba(225,112,85,0.15); border-radius: 8px; padding: 8px 12px; margin-top: 6px; font-size: 11px; color: #e17055; }
    .hs { display: inline-flex; align-items: center; gap: 8px; }
    .hs__ring { width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800; font-family: monospace; flex-shrink: 0; }
    .hs__ring--good { background: rgba(85,239,196,0.1); color: #55efc4; border: 2px solid #55efc4; }
    .hs__ring--warn { background: rgba(253,203,110,0.1); color: #fdcb6e; border: 2px solid #fdcb6e; }
    .hs__ring--bad { background: rgba(225,112,85,0.1); color: #e17055; border: 2px solid #e17055; }
    .action-item { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.04); display: flex; align-items: center; gap: 12px; }
    .action-item:last-child { border-bottom: none; }
    .action-item__tag { font-size: 10px; padding: 2px 8px; border-radius: 100px; background: rgba(108,92,231,0.1); color: #a29bfe; font-weight: 600; flex-shrink: 0; }
    .action-item__text { flex: 1; font-size: 13px; }
    .action-item__roi { font-size: 12px; font-weight: 700; font-family: monospace; color: #55efc4; flex-shrink: 0; }
    .issue-card { padding: 14px; border-left: 3px solid; margin-bottom: 10px; }
    .issue-card:last-child { margin-bottom: 0; }
    .issue-card__h { display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    .issue-card__h span { font-family: monospace; color: #e17055; }
    .issue-card__d { font-size: 12px; color: #a1a1aa; }
    .exec-trend { display: flex; align-items: end; gap: 2px; height: 30px; }
    .exec-trend div { width: 6px; border-radius: 2px 2px 0 0; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #0a0a0f; color: #e4e4e7; }
    .c-accent { color: #6c5ce7; }
    .topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: rgba(10,10,15,0.95); border-bottom: 1px solid rgba(255,255,255,0.06); }
    .topbar__inner { display: flex; align-items: center; gap: 24px; max-width: 1200px; margin: 0 auto; padding: 0 16px; height: 56px; }
    .topbar__logo { font-weight: 700; font-size: 16px; white-space: nowrap; }
    .topbar__nav { display: flex; gap: 4px; overflow-x: auto; }
    .topbar__btn { background: none; border: none; color: #a1a1aa; padding: 6px 12px; border-radius: 6px; font-size: 13px; cursor: pointer; white-space: nowrap; transition: all .15s; font-family: inherit; }
    .topbar__btn:hover { color: #fff; background: rgba(255,255,255,0.04); }
    .topbar__btn.active { color: #fff; background: rgba(108,92,231,0.15); }
    #app { padding-top: 56px; min-height: 100vh; }
    .loading { display: flex; align-items: center; justify-content: center; height: calc(100vh - 56px); font-size: 18px; color: #a1a1aa; }
    .view { max-width: 1200px; margin: 0 auto; padding: 24px 16px; }
    .view h2 { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    .view p { color: #a1a1aa; margin-bottom: 24px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 24px; }
    .card { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; padding: 16px; }
    .card--hl { background: linear-gradient(135deg, rgba(108,92,231,0.08), rgba(0,206,201,0.03)); border-color: rgba(108,92,231,0.25); }
    .card__l { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: #a1a1aa; font-weight: 600; margin-bottom: 6px; }
    .card__v { font-size: 26px; font-weight: 800; font-family: 'Courier New', monospace; }
    .card__v--dng { color: #e17055; }
    .card__v--prf { background: linear-gradient(135deg,#55efc4,#00cec9); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .card__t { font-size: 11px; color: #a1a1aa; margin-top: 4px; }
    .card__t--up::before { content: "▲ "; color: #55efc4; }
    .card__t--dn::before { content: "▼ "; color: #e17055; }
    .bar { height: 8px; border-radius: 4px; background: rgba(255,255,255,0.06); overflow: hidden; margin-top: 6px; }
    .bar__fill { height: 100%; border-radius: 4px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
    .block { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; padding: 16px; }
    .block__h { font-size: 14px; font-weight: 600; margin-bottom: 12px; display: flex; justify-content: space-between; }
    .block__h span { font-size: 11px; color: #a29bfe; background: rgba(108,92,231,0.1); padding: 2px 8px; border-radius: 100px; }
    .stat { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 13px; }
    .stat:last-child { border-bottom: none; }
    .stat__l { color: #a1a1aa; }
    .stat__r { font-weight: 600; }
    .stat__r--dng { color: #e17055; }
    .stat__r--up { color: #55efc4; }
    .alert-item { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.04); cursor: pointer; }
    .alert-item:hover { background: rgba(255,255,255,0.02); }
    .alert-item:last-child { border-bottom: none; }
    .alert-h { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
    .alert-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .alert-dot--h { background: #e17055; box-shadow: 0 0 6px rgba(225,112,85,0.4); }
    .alert-dot--m { background: #fdcb6e; }
    .alert-dot--l { background: #55efc4; }
    .alert-t { font-size: 13px; font-weight: 600; }
    .alert-i { margin-left: auto; font-family: monospace; font-weight: 700; font-size: 13px; color: #e17055; }
    .alert-d { font-size: 12px; color: #a1a1aa; margin-bottom: 6px; }
    .alert-a { display: flex; gap: 6px; }
    .alert-a span { font-size: 11px; padding: 3px 8px; border-radius: 4px; background: rgba(108,92,231,0.1); color: #a29bfe; cursor: pointer; }
    .sim-l { display: grid; grid-template-columns: 1.2fr 1fr; gap: 16px; }
    .sim-ctrl { margin-bottom: 16px; }
    .sim-ctrl label { display: block; font-size: 13px; margin-bottom: 6px; }
    .sim-ctrl input[type=range] { width: 100%; }
    .sim-ctrl .val { font-size: 14px; color: #a29bfe; font-family: monospace; font-weight: 700; text-align: right; }
    .sim-b { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; padding: 16px; margin-bottom: 12px; }
    .sim-b--pr { background: linear-gradient(135deg, rgba(108,92,231,0.05), rgba(0,206,201,0.02)); border-color: rgba(108,92,231,0.2); }
    .sim-row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 13px; }
    .sim-row .l { color: #a1a1aa; }
    .sim-row .v { font-weight: 700; font-family: monospace; }
    .sim-row .v--p { background: linear-gradient(135deg,#55efc4,#00cec9); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .sim-impact { font-size: 14px; font-weight: 600; color: #55efc4; margin-bottom: 8px; }
    .vsrch { display: flex; gap: 0; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; overflow: hidden; margin-bottom: 12px; }
    .vsrch input { flex: 1; background: none; border: none; padding: 12px; font-size: 14px; color: #fff; outline: none; font-family: inherit; }
    .vsrch button { background: #6c5ce7; color: #fff; border: none; padding: 12px 20px; font-weight: 600; cursor: pointer; font-family: inherit; }
    .vchip { display: inline-block; padding: 4px 12px; border-radius: 100px; background: rgba(108,92,231,0.08); border: 1px solid rgba(108,92,231,0.2); color: #a29bfe; font-size: 12px; cursor: pointer; margin: 4px; }
    .vreason { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06); border-radius: 8px; padding: 12px 16px; margin-bottom: 8px; }
    .vreason h4 { font-size: 14px; margin-bottom: 4px; display: flex; justify-content: space-between; }
    .vreason h4 span { color: #a29bfe; font-family: monospace; }
    .vreason .sent { font-size: 12px; color: #a1a1aa; }
    .vreason .q { font-style: italic; color: #a1a1aa; font-size: 13px; padding: 6px 10px; background: rgba(0,0,0,0.2); border-radius: 6px; border-left: 2px solid #6c5ce7; margin-top: 6px; }
    .roi-c { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; padding: 24px; }
    .roi-f { margin-bottom: 20px; }
    .roi-f label { display: block; font-size: 13px; color: #d4d4d8; margin-bottom: 8px; }
    .roi-f input { width: 100%; }
    .roi-f .rv { display: flex; justify-content: space-between; font-size: 11px; color: #a1a1aa; margin-top: 4px; }
    .roi-f .rv span:nth-child(2) { color: #fff; font-weight: 700; }
    .roi-res { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06); border-radius: 8px; padding: 14px 18px; margin-bottom: 12px; }
    .roi-res--hl { background: linear-gradient(135deg, rgba(108,92,231,0.08), rgba(0,206,201,0.03)); border-color: rgba(108,92,231,0.3); }
    .roi-res .l { font-size: 12px; color: #a1a1aa; margin-bottom: 4px; }
    .roi-res .v { font-size: 22px; font-weight: 800; font-family: monospace; }
    .roi-res .v--p { background: linear-gradient(135deg,#55efc4,#00cec9); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    @media (max-width: 768px) {
      .grid-2, .sim-l, .roi-c { grid-template-columns: 1fr; }
      .topbar__nav { gap: 2px; }
      .topbar__btn { font-size: 12px; padding: 4px 8px; }
    }
  </style>
</body>
</html>
