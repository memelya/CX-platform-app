<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CX Profit Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a0a0f'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-size='22' font-weight='bold' fill='%236c5ce7' font-family='sans-serif'%3E◆%3C/text%3E%3C/svg%3E" />
  <script type="module" src="/src/main.js"></script>
</head>
<body>
  <nav class="nav" id="nav">
    <div class="nav__inner">
      <div class="nav__logo">
        <span class="nav__logo-icon">◆</span>
        <span>CX<span class="text-accent">Profit</span></span>
      </div>
      <div class="nav__links" id="navLinks">
        <a class="nav__link nav__link--active" data-view="dashboard">Дашборд</a>
        <a class="nav__link" data-view="profit">Profit Cockpit</a>
        <a class="nav__link" data-view="simulation">Симулятор</a>
        <a class="nav__link" data-view="voice">Voice AI</a>
        <a class="nav__link" data-view="roi">ROI</a>
      </div>
      <div class="nav__right">
        <select class="nav__select" id="periodSelect">
          <option>Последние 7 дней</option>
          <option selected>Последние 30 дней</option>
          <option>Последний квартал</option>
          <option>Последний год</option>
        </select>
        <button class="nav__alert-btn" id="alertBtn" title="Алерты">
          <span>🔔</span>
          <span class="nav__alert-badge" id="alertBadge">3</span>
        </button>
      </div>
    </div>
  </nav>

  <main id="app">
    <div class="loading">🧿 Загружаем платформу...</div>
  </main>

  <div class="alert-panel" id="alertPanel">
    <div class="alert-panel__header">
      <h3>Алерты</h3>
      <button id="alertClose">✕</button>
    </div>
    <div class="alert-panel__list" id="alertList"></div>
  </div>
  <div class="alert-overlay" id="alertOverlay"></div>
</body>
</html>
